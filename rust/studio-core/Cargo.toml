[package]
name = "godsat-studio-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic frame interpolation and custody state for the GoDSAT browser studio"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
