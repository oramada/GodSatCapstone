name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
          - os: ubuntu-24.04
            python-version: "3.13"
          - os: macos-14
            python-version: "3.11"
          - os: windows-2022
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m godsat --help
      - run: python -m godsat doctor
