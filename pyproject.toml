[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "godsat-factorial"
version = "0.1.0"
description = "Student research starter for satellite tasking and factorial hyperparameter studies"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
  "duckdb>=1.0,<2",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pyarrow>=16,<18",
  "pytz>=2023.3",
  "scipy>=1.10",
  "sgp4>=2.22",
  "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
awp = ["astropy>=6,<8", "spiceypy>=6"]
telemetry = ["cdflib>=1.3,<2", "h5py>=3.8"]
analysis = ["scikit-learn>=1.3"]

[project.scripts]
godsat = "godsat.cli:main"

[tool.setuptools]
packages = ["godsat", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
